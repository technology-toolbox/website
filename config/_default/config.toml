baseURL = "https://www.techtoolbox.us/"
languageCode = "en-us"
title = "Technology Toolbox"
theme = "techtoolbox-hugo"

enableGitInfo = true

[markup]
  [markup.highlight]
    noClasses = false # Use class attributes for code syntax highlighting

  [markup.goldmark.renderer]
    unsafe= true

[menu]

  [[menu.main]]
    identifier = "services"
    name = "Services"
    url = "/services/"
    weight = 10

  [[menu.main]]
    identifier = "company"
    name = "Company"
    url = "/company/"
    weight = 20

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/jjameson/"
    weight = 30

[permalinks]
  categories = "/blog/jjameson/category/:title/"

[social]
  github = "technology-toolbox"
  twitter = "techtoolbox_"

[server]
[[server.headers]]
  for = '/**'
  [server.headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; img-src 'self' data: https://*.techtoolbox.us https://www.googletagmanager.com https://*.google-analytics.com; script-src 'self' 'report-sha256'; script-src-elem 'self' https://cdnjs.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline';"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    X-Frame-Options = 'DENY'
[[server.headers]]
  for = '/blog/**'
  [server.headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://commento.techtoolbox.us ws://commento.techtoolbox.us https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; font-src 'self' https://commento.techtoolbox.us; frame-src https://platform.twitter.com; img-src 'self' data: https://*.techtoolbox.us https://www.googletagmanager.com https://*.google-analytics.com; script-src 'self' data: 'report-sha256'; script-src-elem 'self' https://commento.techtoolbox.us https://cdnjs.cloudflare.com https://static.cloudflareinsights.com https://www.googletagmanager.com https://platform.twitter.com https://platform.x.com; style-src 'self' 'unsafe-inline' https://commento.techtoolbox.us;"
[[server.headers]]
  for = '/search/**'
  [server.headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://cdnjs.cloudflare.com https://*.adtrafficquality.google https://www.googletagmanager.com https://*.google-analytics.com https://*.google.com; frame-src https://*.adtrafficquality.google https://syndicatedsearch.goog/; img-src 'self' data: clients1.google.com https://*.gstatic.com https://*.adtrafficquality.google  https://cse.google.com https://www.google.com https://www.googleapis.com https://www.google-analytics.com https://www.googletagmanager.com; script-src 'self' 'unsafe-eval' data: https://cdnjs.cloudflare.com https://static.cloudflareinsights.com cse.google.com https://www.google.com https://*.adtrafficquality.google https://partner.googleadservices.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://commento.techtoolbox.us https://static.cloudflareinsights.com https://www.google.com;"